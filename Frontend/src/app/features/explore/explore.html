<section class="mx-auto w-full max-w-[1180px] px-3 py-4 min-[380px]:px-4 sm:py-5 lg:px-6">
  <header class="mb-4 flex items-center justify-between gap-4">
    <div>
      <h1 class="text-[18px] font-bold text-[#111827]">{{ prefs.t('explore') }}</h1>
      <p class="mt-1 text-[12px] text-[#667085]">{{ prefs.t('recentCommunity') }}</p>
    </div>
    <button class="grid size-9 place-items-center rounded-full bg-white text-[#28334b] shadow-sm" type="button" [attr.aria-label]="prefs.t('filterExplore')">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M7 12h10M10 17h4" /></svg>
    </button>
  </header>

  <div class="grid auto-rows-[170px] grid-cols-2 gap-1 overflow-hidden rounded-[8px] bg-white p-1 shadow-sm sm:auto-rows-[220px] md:grid-cols-6 md:auto-rows-[255px]">
    @for (item of exploreItems; track item.id) {
      <article class="group relative min-h-0 overflow-hidden bg-[#d9dee8] {{ item.className }}">
        <img class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.03]" [src]="item.image" [alt]="item.title" />
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/65 to-transparent p-3 opacity-0 transition duration-200 group-hover:opacity-100">
          <h2 class="truncate text-[13px] font-bold text-white">{{ item.title }}</h2>
          <p class="mt-0.5 truncate text-[10px] font-semibold text-white/80">{{ item.author }}</p>
        </div>

        @if (item.kind === 'video') {
          <span class="absolute right-3 top-3 grid size-7 place-items-center rounded-full bg-white text-[#28334b] shadow-sm">
            <svg class="size-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z" /></svg>
          </span>
        } @else if (item.kind === 'album') {
          <span class="absolute right-3 top-3 grid size-7 place-items-center rounded-full bg-white text-[#28334b] shadow-sm">
            <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="12" height="12" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1" /></svg>
          </span>
        }
      </article>
    }
  </div>
</section>
