<section class="mx-auto w-full max-w-[1088px] px-3 py-4 sm:px-5 lg:px-6">
  <header class="mb-5">
    <h1 class="text-[18px] font-bold text-[#111827]">{{ prefs.t('settingsTitle') }}</h1>
    <p class="mt-1 text-[12px] leading-5 text-[#667085]">{{ prefs.t('settingsSubtitle') }}</p>
  </header>

  <div class="grid grid-cols-1 gap-5 lg:grid-cols-[minmax(0,1fr)_340px]">
    <section class="space-y-5">
      <article class="rounded-[8px] bg-white p-5 shadow-sm">
        <div class="mb-5 flex items-center gap-3">
          <span class="grid size-10 place-items-center rounded-[8px] bg-[#eef2f7] text-[#28334b]">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
          </span>
          <div>
            <h2 class="text-[15px] font-bold text-[#111827]">{{ prefs.t('security') }}</h2>
            <p class="text-[11px] text-[#667085]">{{ prefs.t('changePassword') }}</p>
          </div>
        </div>

        <form class="grid gap-4" (submit)="$event.preventDefault()">
          <label class="text-[12px] font-bold text-[#344054]">
            {{ prefs.t('currentPassword') }}
            <input class="mt-2 h-11 w-full rounded-[8px] border border-[#d7deea] px-4 text-[14px] outline-none focus:border-[#28334b]" type="password" />
          </label>
          <div class="grid gap-4 sm:grid-cols-2">
            <label class="text-[12px] font-bold text-[#344054]">
              {{ prefs.t('newPassword') }}
              <input class="mt-2 h-11 w-full rounded-[8px] border border-[#d7deea] px-4 text-[14px] outline-none focus:border-[#28334b]" type="password" />
            </label>
            <label class="text-[12px] font-bold text-[#344054]">
              {{ prefs.t('confirmPassword') }}
              <input class="mt-2 h-11 w-full rounded-[8px] border border-[#d7deea] px-4 text-[14px] outline-none focus:border-[#28334b]" type="password" />
            </label>
          </div>
          <button class="mt-1 h-10 w-max rounded-[8px] bg-[#28334b] px-5 text-[12px] font-bold text-white" type="submit">{{ prefs.t('updatePassword') }}</button>
        </form>
      </article>
    </section>
    <aside class="space-y-5">
      <article class="rounded-[8px] bg-white p-5 shadow-sm">
        <h2 class="text-[15px] font-bold text-[#111827]">{{ prefs.t('legal') }}</h2>
        <div class="mt-4 space-y-4">
          <section class="rounded-[8px] bg-[#f4f7fb] p-4">
            <h3 class="text-[12px] font-bold text-[#111827]">{{ prefs.t('privacy') }}</h3>
            <p class="mt-2 text-[11px] leading-5 text-[#667085]">{{ prefs.t('termsBody') }}</p>
          </section>
          <section class="rounded-[8px] bg-[#f4f7fb] p-4">
            <h3 class="text-[12px] font-bold text-[#111827]">{{ prefs.t('terms') }}</h3>
            <p class="mt-2 text-[11px] leading-5 text-[#667085]">{{ prefs.t('serviceTermsBody') }}</p>
          </section>
        </div>
      </article>
    </aside>
  </div>
</section>
