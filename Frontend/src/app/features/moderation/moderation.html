<section class="mx-auto w-full max-w-[1088px] px-3 py-5 sm:px-5 lg:px-8">
  <header class="mb-7">
    <h1 class="text-[20px] font-bold leading-6 text-[#111827]">Moderacao</h1>
  </header>

  <div class="grid w-full max-w-[360px] grid-cols-2 gap-5">
    <article class="h-[118px] rounded-[8px] bg-white p-5 shadow-[0_10px_28px_rgba(15,23,42,0.06)]">
      <div class="flex items-start justify-between gap-4">
        <p class="text-[10px] font-semibold leading-4 text-[#6b7484]">Comentarios<br />Denunciados</p>
        <span class="grid size-6 place-items-center rounded-[6px] text-[#1f6fff]">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z" /><path d="M8 9h8M8 13h5" /></svg>
        </span>
      </div>
      <p class="mt-4 text-[24px] font-medium leading-none text-[#1f2937]">1,284</p>
    </article>

    <article class="h-[118px] rounded-[8px] bg-white p-5 shadow-[0_10px_28px_rgba(15,23,42,0.06)]">
      <div class="flex items-start justify-between gap-4">
        <p class="text-[10px] font-semibold leading-4 text-[#6b7484]">Utilizadores</p>
        <span class="grid size-6 place-items-center rounded-[6px] text-[#1f6fff]">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3" /><path d="M3.5 19a5.5 5.5 0 0 1 11 0" /><circle cx="17" cy="9" r="2.4" /><path d="M15.5 15.5a4 4 0 0 1 5 3.5" /></svg>
        </span>
      </div>
      <p class="mt-4 text-[24px] font-medium leading-none text-[#1f2937]">42</p>
      <p class="mt-2 text-[8px] font-bold text-[#a35400]">Quantidade de utilizadores</p>
    </article>
  </div>

  <section class="mt-7 overflow-hidden rounded-[8px] bg-white shadow-[0_10px_28px_rgba(15,23,42,0.06)]">
    <header class="flex h-[54px] items-center justify-between bg-[#f5f3ff] px-8">
      <h2 class="text-[13px] font-bold text-[#111827]">Denuncias Recentes</h2>
      <button class="text-[10px] font-medium text-[#1f6fff]" type="button">Ver Tudo</button>
    </header>

    <div class="overflow-x-auto">
      <table class="w-full min-w-[640px] border-collapse text-left">
        <thead>
          <tr class="h-12 bg-white text-[11px] font-bold text-[#1f2937]">
            <th class="w-[36%] px-24">Utilizador</th>
            <th class="w-[36%] px-6">Motivo</th>
            <th class="w-[28%] px-6">Estado</th>
          </tr>
        </thead>
        <tbody>
          @for (report of reports; track report.user) {
            <tr class="h-[82px] border-t border-[#f1f4f8] text-[11px] font-bold text-[#1f2937] first:border-l-[4px] first:border-l-[#1f6fff]">
              <td class="px-24">{{ report.user }}</td>
              <td class="px-6">
                <span
                  [class]="report.reason === 'Discurso de Odio'
                    ? 'rounded-full bg-[#fee2e2] px-2.5 py-1 text-[7px] font-bold uppercase text-[#dc2626]'
                    : report.reason === 'Spam/Publicidade'
                      ? 'rounded-full bg-[#e0e7ff] px-2.5 py-1 text-[7px] font-bold uppercase text-[#4f46e5]'
                      : 'rounded-full bg-[#f3f4f6] px-2.5 py-1 text-[7px] font-bold uppercase text-[#6b7280]'"
                >
                  {{ report.reason }}
                </span>
              </td>
              <td class="px-6">
                <span [class]="report.status === 'Pendente' ? 'text-[9px] font-bold text-[#b45309]' : 'text-[9px] font-bold text-[#6b7280]'">
                  + {{ report.status }}
                </span>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</section>
