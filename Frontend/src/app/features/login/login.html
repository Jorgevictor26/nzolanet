<main class="relative min-h-dvh overflow-hidden bg-white text-[#111827]">
  <div class="absolute -left-20 -top-28 size-[260px] rounded-full bg-[#28334b] shadow-[0_8px_18px_rgba(40,51,75,0.22)] sm:-left-16 sm:-top-24 sm:size-[330px] lg:-left-12 lg:-top-20 lg:size-[360px]"></div>
  <div class="absolute bottom-[-76px] left-[8%] h-[220px] w-[220px] rotate-[36deg] rounded-[42px] bg-[#28334b] shadow-[0_8px_18px_rgba(40,51,75,0.2)] sm:bottom-[-96px] sm:left-[13%] sm:h-[270px] sm:w-[270px] lg:bottom-[-116px] lg:left-[10%] lg:h-[320px] lg:w-[320px]"></div>
  <div class="absolute right-[-70px] top-[18%] hidden h-[230px] w-[330px] rotate-[28deg] rounded-[64px] bg-[#28334b] shadow-[0_8px_18px_rgba(40,51,75,0.2)] md:block lg:right-[8%] lg:h-[270px] lg:w-[390px] xl:right-[11%] xl:top-[15%] xl:h-[300px] xl:w-[430px]">
    <div class="grid h-full place-items-center -rotate-[28deg] px-16 text-center">
      <h2 class="text-[22px] font-extrabold leading-7 text-white">Fa&ccedil;a o Login em nossa<br />Plataforma</h2>
    </div>
  </div>
  <div class="absolute bottom-0 left-0 right-0 h-12 bg-[#28334b] sm:h-14"></div>

  <section class="relative z-10 flex min-h-dvh items-center justify-center px-4 py-16 sm:px-6 lg:justify-start lg:pl-[16%] xl:pl-[16%]">
    <div class="w-full max-w-[360px] rounded-[8px] bg-white px-7 py-8 shadow-[0_4px_18px_rgba(15,23,42,0.24)] sm:max-w-[410px] sm:px-9 sm:py-10">
      <header class="text-center">
        <h1 class="text-[18px] font-extrabold text-[#4b5565]">
          Bem vindo ao <span class="text-[#28334b]">LOGIN</span>
        </h1>
        <p class="mt-9 text-[11px] font-medium text-[#9aa4b2]">Preencha os dados do login para acessar</p>
      </header>

      <form class="mt-9 space-y-8">
        <label class="block">
          <span class="text-[11px] font-semibold text-[#647084]">Usu&aacute;rio</span>
          <span class="mt-1 flex h-9 items-center border-b border-[#cfd5df]">
            <input class="min-w-0 flex-1 bg-transparent text-[12px] font-medium text-[#111827] outline-none placeholder:text-[#aab4c4]" type="text" value="jhonasrodrigues" autocomplete="username" />
            <svg class="size-4 shrink-0 text-[#6b7280]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-7 2.2-7 5v1h14v-1c0-2.8-3-5-7-5Z" /></svg>
          </span>
        </label>

        <label class="block">
          <span class="text-[11px] font-semibold text-[#647084]">Senha</span>
          <span class="mt-1 flex h-9 items-center border-b border-[#cfd5df]">
            <input class="min-w-0 flex-1 bg-transparent text-[12px] font-medium text-[#111827] outline-none placeholder:text-[#aab4c4]" [type]="isPasswordVisible() ? 'text' : 'password'" value="senhadeacesso" autocomplete="current-password" />
            <button class="grid size-7 shrink-0 place-items-center text-[#6b7280]" type="button" aria-label="Mostrar ou ocultar senha" (click)="togglePasswordVisibility()">
              @if (isPasswordVisible()) {
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
              } @else {
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18" /><path d="M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6" /><path d="M9.9 4.2A10.5 10.5 0 0 1 12 4c6.5 0 10 8 10 8a18.2 18.2 0 0 1-3.1 4.2" /><path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.5 8 10 8a10.6 10.6 0 0 0 5.9-1.9" /></svg>
              }
            </button>
          </span>
        </label>

        <a class="flex h-10 w-full items-center justify-center rounded-[3px] bg-[#28334b] text-[11px] font-bold text-white transition hover:bg-[#314061]" routerLink="/">
          ENTRAR
        </a>
      </form>
    </div>
  </section>
</main>
